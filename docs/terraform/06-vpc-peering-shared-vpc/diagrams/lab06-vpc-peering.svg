<text x="177.36" y="1054.8" text-anchor="start" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#5F4C00">Peering = private connectivity between two VPCs. Routes are exchanged; firewall policy, IAM and administration stay separate.</text>
<text x="177.36" y="1078.8" text-anchor="start" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#5F4C00">Need many-to-many or central control? Use Shared VPC or a hub with VPN/NCC instead of a peering mesh.</text></svg>
