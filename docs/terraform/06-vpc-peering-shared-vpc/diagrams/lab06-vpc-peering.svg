2"/><text x="725" y="650" text-anchor="middle" class="h">Production VPC firewall</text><text x="725" y="678" text-anchor="middle" class="p">Allow selected TCP 22/80/443 and ICMP</text><text x="725" y="700" text-anchor="middle" class="p">Source: 10.0.0.0/16</text><text x="725" y="765" text-anchor="middle" class="p">Peering exchanges routes, but it is non-transitive and does not merge firewall policy or administration.</text></svg>