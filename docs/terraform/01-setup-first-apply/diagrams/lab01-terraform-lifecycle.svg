<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-label="Terraform lifecycle from configuration through destroy"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#455a64"/></marker><style>.t{font:700 24px system-ui;fill:#263238}.h{font:700 15px system-ui;fill:#263238}.p{font:13px system-ui;fill:#455a64}.e{stroke:#455a64;stroke-width:2.5;fill:none;marker-end:url(#a)}</style></defs><rect width="1400" height="520" fill="#fafafa"/><text x="700" y="42" text-anchor="middle" class="t">Terraform Lab 01 — Declarative Lifecycle</text><g><rect x="45" y="175" width="190" height="110" rx="14" fill="#e3f2fd" stroke="#4f81bd" stroke-width="2"/><text x="140" y="210" text-anchor="middle" class="h">main.tf</text><text x="140" y="238" text-anchor="middle" class="p">Provider · variables</text><text x="140" y="260" text-anchor="middle" class="p">google_compute_network</text><rect x="285" y="175" width="170" height="110" rx="14" fill="#fff4cc" stroke="#c9a227" stroke-width="2"/><text x="370" y="210" text-anchor="middle" class="h">terraform init</text><text x="370" y="238" text-anchor="middle" class="p">Downloads provider</text><text x="370" y="260" text-anchor="middle" class="p">Prepares directory</text><rect x="505" y="175" width="170" height="110" rx="14" fill="#ffe8cc" stroke="#d38b20" stroke-width="2"/><text x="590" y="210" text-anchor="middle" class="h">terraform plan</text><text x="590" y="238" text-anchor="middle" class="p">Previews changes</text><text x="590" y="260" text-anchor="middle" class="p">No mutation</text><rect x="725" y="175" width="170" height="110" rx="14" fill="#e6f4e2" stroke="#6c9f54" stroke-width="2"/><text x="810" y="210" text-anchor="middle" class="h">terraform apply</text><text x="810" y="238" text-anchor="middle" class="p">Creates tf-first-vpc</text><text x="810" y="260" text-anchor="middle" class="p">Updates state</text><rect x="945" y="175" width="170" height="110" rx="14" fill="#f3e8f7" stroke="#8e63a9" stroke-width="2"/><text x="1030" y="210" text-anchor="middle" class="h">terraform.tfstate</text><text x="1030" y="238" text-anchor="middle" class="p">Maps config to GCP</text><text x="1030" y="260" text-anchor="middle" class="p">Never edit manually</text><rect x="1165" y="175" width="190" height="110" rx="14" fill="#fde2e0" stroke="#bf5b55" stroke-width="2"/><text x="1260" y="210" text-anchor="middle" class="h">terraform destroy</text><text x="1260" y="238" text-anchor="middle" class="p">Removes the VPC</text><text x="1260" y="260" text-anchor="middle" class="p">Lab 01 ends cleanly</text></g><path d="M235 230H285M455 230H505M675 230H725M895 230H945M1115 230H1165" class="e"/><path d="M1260 285V400H140V285" class="e"/><text x="700" y="430" text-anchor="middle" class="p">Edit configuration and repeat: Terraform continuously reconciles declared intent with real infrastructure.</text></svg>