<text x="177.36" y="1034.8" text-anchor="start" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#5F4C00">IP = which network (changes per network) · MAC = which device on this wire (rewritten at every hop).</text>
<text x="177.36" y="1058.8" text-anchor="start" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#5F4C00">ARP = broadcast question, unicast answer, then cache. Unauthenticated → ARP spoofing; defence = Dynamic ARP Inspection.</text></svg>
