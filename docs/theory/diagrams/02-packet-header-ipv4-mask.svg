<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1050" viewBox="0 0 1360 1050" role="img" aria-labelledby="t d"><title id="t">Anatomy of a packet and how an IPv4 address is read</title><desc id="d">A header tells every router what to do; the mask splits an address into &#x27;which network&#x27; and &#x27;which host&#x27;</desc><defs><filter id="sh" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1B2A4A" flood-opacity="0.16"/></filter><linearGradient id="g0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4F46E5"/><stop offset="1" stop-color="#443CC5"/></linearGradient><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E8F1FF"/><stop offset="1" stop-color="#CFE1FE"/></linearGradient><linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F1E9FE"/><stop offset="1" stop-color="#E3D5FC"/></linearGradient><linearGradient id="g3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FDE8E8"/><stop offset="1" stop-color="#FBD1D1"/></linearGradient><linearGradient id="g4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF0DC"/><stop offset="1" stop-color="#FDE4BF"/></linearGradient><linearGradient id="g5" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F1F3F6"/><stop offset="1" stop-color="#E1E4E9"/></linearGradient><linearGradient id="g6" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E4F7EC"/><stop offset="1" stop-color="#C8ECDA"/></linearGradient><linearGradient id="g7" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#DFF6F5"/><stop offset="1" stop-color="#C0EBE9"/></linearGradient><linearGradient id="g8" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient><linearGradient id="g9" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2F6FE0"/><stop offset="1" stop-color="#285FC1"/></linearGradient><linearGradient id="g10" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1E9A63"/><stop offset="1" stop-color="#1A8455"/></linearGradient><linearGradient id="g11" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF8D6"/><stop offset="1" stop-color="#FBEFBA"/></linearGradient><linearGradient id="g12" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E8890C"/><stop offset="1" stop-color="#C8760A"/></linearGradient></defs><rect width="1360" height="1050" fill="#FBFCFE"/><rect x="0.0" y="0" width="273.0" height="8" fill="#2F6FE0"/>
<rect x="272.0" y="0" width="273.0" height="8" fill="#7C4DDB"/>
<rect x="544.0" y="0" width="273.0" height="8" fill="#D63F8C"/>
<rect x="816.0" y="0" width="273.0" height="8" fill="#E8890C"/>
<rect x="1088.0" y="0" width="273.0" height="8" fill="#1E9A63"/>
<text x="44" y="59.2" text-anchor="start" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="32" font-weight="700" fill="#1F2A44">Anatomy of a packet and how an IPv4 address is read</text>
<text x="44" y="90.0" text-anchor="start" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#5B6677">A header tells every router what to do; the mask splits an address into &#x27;which network&#x27; and &#x27;which host&#x27;</text>
<rect x="1093.84" y="30" width="222.16" height="30" rx="15.0" fill="url(#g0)" stroke="#3932A5" stroke-width="2"/><text x="1204.9199999999998" y="49.2" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" letter-spacing="1.2">STAGE 02 · PACKETS &amp; IP</text>
<text x="44" y="128.7" text-anchor="start" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#2B2D8F" letter-spacing="1.2">1 · IPV4 HEADER (20 BYTES, 32 BITS PER ROW)</text>
<rect x="44" y="152" width="87.5" height="46" rx="4" fill="url(#g1)" stroke="#4C8DF6" stroke-width="1.8"/><text x="87.75" y="180.2" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#1C3F94">Version</text>
<rect x="131.5" y="152" width="87.5" height="46" rx="4" fill="url(#g1)" stroke="#4C8DF6" stroke-width="1.8"/><text x="175.25" y="180.2" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#1C3F94">IHL</text>
<rect x="219.0" y="152" width="175.0" height="46" rx="4" fill="url(#g1)" stroke="#4C8DF6" stroke-width="1.8"/><text x="306.5" y="180.2" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#1C3F94">DSCP / ECN</text>
<rect x="394.0" y="152" width="350.0" height="46" rx="4" fill="url(#g1)" stroke="#4C8DF6" stroke-width="1.8"/><text x="569.0" y="180.2" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#1C3F94">Total length</text>
<rect x="44" y="202" width="350.0" height="46" rx="4" fill="url(#g2)" stroke="#9B6CF0" stroke-width="1.8"/><text x="219.0" y="230.2" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#4B2A9A">Identification</text>
<rect x="394.0" y="202" width="65.625" height="46" rx="4" fill="url(#g2)" stroke="#9B6CF0" stroke-width="1.8"/><text x="426.8125" y="230.2" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#4B2A9A">Flags</text>
<rect x="459.625" y="202" width="284.375" height="46" rx="4" fill="url(#g2)" stroke="#9B6CF0" stroke-width="1.8"/><text x="601.8125" y="230.2" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#4B2A9A">Fragment offset</text>
<rect x="44" y="252" width="175.0" height="46" rx="4" fill="url(#g3)" stroke="#EF5B5B" stroke-width="1.8"/><text x="131.5" y="280.2" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#8E1B1B">TTL — hop limit</text>
<rect x="219.0" y="252" width="175.0" height="46" rx="4" fill="url(#g4)" stroke="#F5A524" stroke-width="1.8"/><text x="306.5" y="280.2" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#7A4300">Protocol (TCP=6)</text>
<rect x="394.0" y="252" width="350.0" height="46" rx="4" fill="url(#g5)" stroke="#8B95A5" stroke-width="1.8"/><text x="569.0" y="280.2" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#2F3846">Header checksum</text>
<rect x="44" y="302" width="700.0" height="46" rx="4" fill="url(#g6)" stroke="#34B27B" stroke-width="1.8"/><text x="394.0" y="330.2" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#11603E">Source IP address</text>
<rect x="44" y="352" width="700.0" height="46" rx="4" fill="url(#g7)" stroke="#20B2AA" stroke-width="1.8"/><text x="394.0" y="380.2" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#0B5E5A">Destination IP address</text>
<rect x="44" y="402" width="700.0" height="46" rx="4" fill="url(#g5)" stroke="#8B95A5" stroke-width="1.8"/><text x="394.0" y="430.2" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#2F3846">Options + padding (rare)</text>
<text x="44" y="469.6" text-anchor="start" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#5B6677">Routers read only this part (Layer 3) — they never look inside the payload.</text>
<rect x="780" y="152" width="536" height="148" rx="14" fill="url(#g3)" stroke="#EF5B5B" stroke-width="2" filter="url(#sh)"/>
<text x="800" y="183.3" text-anchor="start" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#8E1B1B">TTL — the loop breaker</text><text x="800" y="205.8" text-anchor="start" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#8E1B1B">Every router subtracts 1.</text><text x="800" y="226.8" text-anchor="start" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#8E1B1B">At 0 the packet is dropped and an</text><text x="800" y="247.8" text-anchor="start" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#8E1B1B">ICMP &#x27;time exceeded&#x27; is sent back.</text><text x="800" y="268.8" text-anchor="start" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#5B6677">traceroute exploits exactly this.</text>
<rect x="1130" y="170" width="164" height="112" rx="14" fill="url(#g8)" stroke="#EF5B5B" stroke-width="2" filter="url(#sh)"/><text x="1212.0" y="212.8" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#D93F3F">64</text><text x="1212.0" y="233.1" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#B05F5F">start</text><text x="1212.0" y="253.2" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#8E1B1B">→ 63 → 62 → …</text>
<rect x="780" y="316" width="536" height="90" rx="14" fill="url(#g4)" stroke="#F5A524" stroke-width="2" filter="url(#sh)"/>
<text x="800" y="345.3" text-anchor="start" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#7A4300">Protocol — who gets the payload?</text><text x="800" y="367.8" text-anchor="start" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#7A4300">6 → TCP   17 → UDP   1 → ICMP   89 → OSPF</text>
<text x="800" y="393.6" text-anchor="start" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#5B6677">The value tells the receiving host which Layer-4 handler to hand the data to.</text>
<text x="44" y="512.7" text-anchor="start" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#2B2D8F" letter-spacing="1.2">2 · READING AN ADDRESS WITH ITS MASK  (192.168.1.77 / 24)</text>
<rect x="44" y="538" width="304" height="78" rx="14" fill="url(#g1)" stroke="#4C8DF6" stroke-width="2" filter="url(#sh)"/><text x="196.0" y="573.3" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#1C3F94">192</text><text x="196.0" y="594.9" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="500" fill="#1C3F94">11000000</text>
<rect x="360" y="538" width="304" height="78" rx="14" fill="url(#g1)" stroke="#4C8DF6" stroke-width="2" filter="url(#sh)"/><text x="512.0" y="573.3" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#1C3F94">168</text><text x="512.0" y="594.9" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="500" fill="#1C3F94">10101000</text>
<rect x="676" y="538" width="304" height="78" rx="14" fill="url(#g1)" stroke="#4C8DF6" stroke-width="2" filter="url(#sh)"/><text x="828.0" y="573.3" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#1C3F94">1</text><text x="828.0" y="594.9" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="500" fill="#1C3F94">00000001</text>
<rect x="992" y="538" width="304" height="78" rx="14" fill="url(#g6)" stroke="#34B27B" stroke-width="2" filter="url(#sh)"/><text x="1144.0" y="573.3" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#11603E">77</text><text x="1144.0" y="594.9" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="500" fill="#11603E">01001101</text>
<text x="44" y="642.7" text-anchor="start" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#5B6677" letter-spacing="1.2">IP ADDRESS</text>
<rect x="44" y="658" width="304" height="52" rx="4" fill="url(#g9)" stroke="#2250A1" stroke-width="2"/><text x="196.0" y="688.9" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="500" fill="#FFFFFF">11111111</text>
<rect x="360" y="658" width="304" height="52" rx="4" fill="url(#g9)" stroke="#2250A1" stroke-width="2"/><text x="512.0" y="688.9" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="500" fill="#FFFFFF">11111111</text>
<rect x="676" y="658" width="304" height="52" rx="4" fill="url(#g9)" stroke="#2250A1" stroke-width="2"/><text x="828.0" y="688.9" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="500" fill="#FFFFFF">11111111</text>
<rect x="992" y="658" width="304" height="52" rx="4" fill="url(#g10)" stroke="#166F47" stroke-width="2"/><text x="1144.0" y="688.9" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="500" fill="#FFFFFF">00000000</text>
<text x="44" y="730.7" text-anchor="start" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#5B6677" letter-spacing="1.2">SUBNET MASK 255.255.255.0 = /24  (24 ones, 8 zeros)</text>
<rect x="44" y="752" width="936" height="56" rx="28.0" fill="url(#g8)" stroke="#4C8DF6" stroke-width="2" filter="url(#sh)"/><text x="512.0" y="785.2" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#1C3F94">NETWORK PART  192.168.1.0  — identical for every device on this LAN</text>
<rect x="992" y="752" width="304" height="56" rx="28.0" fill="url(#g8)" stroke="#34B27B" stroke-width="2" filter="url(#sh)"/><text x="1144.0" y="785.2" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#11603E">HOST PART  .77</text>
<rect x="44" y="828" width="304" height="86" rx="14" fill="url(#g5)" stroke="#8B95A5" stroke-width="2" filter="url(#sh)"/><text x="196.0" y="854.2" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#2F3846">Network address</text><text x="196.0" y="878.8" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#2F3846">192.168.1.0</text><text x="196.0" y="899.0" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#69707B">all host bits 0</text>
<rect x="360" y="828" width="304" height="86" rx="14" fill="url(#g7)" stroke="#20B2AA" stroke-width="2" filter="url(#sh)"/><text x="512.0" y="854.2" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#0B5E5A">First usable</text><text x="512.0" y="878.8" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#0B5E5A">192.168.1.1</text><text x="512.0" y="899.0" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#4B8C88">usually the gateway</text>
<rect x="676" y="828" width="304" height="86" rx="14" fill="url(#g7)" stroke="#20B2AA" stroke-width="2" filter="url(#sh)"/><text x="828.0" y="854.2" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#0B5E5A">Last usable</text><text x="828.0" y="878.8" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#0B5E5A">192.168.1.254</text><text x="828.0" y="899.0" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#4B8C88">2^8 − 2 = 254 hosts</text>
<rect x="992" y="828" width="304" height="86" rx="14" fill="url(#g4)" stroke="#F5A524" stroke-width="2" filter="url(#sh)"/><text x="1144.0" y="854.2" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#7A4300">Broadcast</text><text x="1144.0" y="878.8" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#7A4300">192.168.1.255</text><text x="1144.0" y="899.0" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#A27742">all host bits 1</text>
<rect x="44" y="944" width="1272" height="78" rx="16" fill="url(#g11)" stroke="#E6C229" stroke-width="2" filter="url(#sh)"/>
<rect x="60" y="968.0" width="97.36000000000001" height="30" rx="15.0" fill="url(#g12)" stroke="#A76309" stroke-width="2"/><text x="108.68" y="987.2" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" letter-spacing="1.2">REMEMBER</text>
<text x="177.36" y="974.8" text-anchor="start" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#5F4C00">Mask = where the network ends. /24 → 8 host bits → 256 − 2 usable.  Bigger prefix number = smaller network.</text>
<text x="177.36" y="998.8" text-anchor="start" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#5F4C00">Router rule: compare destination to routing-table prefixes, longest match wins, TTL − 1, forward.</text></svg>
