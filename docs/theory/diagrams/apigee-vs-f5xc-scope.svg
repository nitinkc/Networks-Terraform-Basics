<rect x="60" y="1248.0" width="97.36000000000001" height="30" rx="15.0" fill="url(#g5)" stroke="#A76309" stroke-width="2"/><text x="108.68" y="1267.2" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" letter-spacing="1.2">REMEMBER</text>
<text x="177.36" y="1254.8" text-anchor="start" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#5F4C00">XC answers “is this request allowed onto my network, and which private origin serves it?”</text>
<text x="177.36" y="1278.8" text-anchor="start" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#5F4C00">Apigee answers “is this consumer entitled to this API, and how much?” — each layer is blind to the other&#x27;s job.</text></svg>
