earGradient><linearGradient id="g9" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF8D6"/><stop offset="1" stop-color="#FBEFBA"/></linearGradient></defs><rect width="1360" height="1330" fill="#FBFCFE"/><rect x="0.0" y="0" width="273.0" height="8" fill="#2F6FE0"/>
