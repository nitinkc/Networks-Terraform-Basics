<text x="62" y="355.0" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">F5 XC · delivery &amp; edge security</text>
<rect x="70" y="388" width="568" height="80" rx="14" fill="url(#g3)" stroke="#F5A524" stroke-width="2"/><text x="354.0" y="425.3" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#7A4300">Anycast VIP + DNS</text><text x="354.0" y="445.6" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#A27B4C">global entry point on every RE</text>
<rect x="70" y="480" width="568" height="80" rx="14" fill="url(#g3)" stroke="#F5A524" stroke-width="2"/><text x="354.0" y="517.3" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#7A4300">TLS + WAF + DDoS</text><text x="354.0" y="537.5" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#A27B4C">terminate, inspect, block · signatures · bots</text>
<rect x="70" y="572" width="568" height="80" rx="14" fill="url(#g3)" stroke="#F5A524" stroke-width="2"/><text x="354.0" y="609.3" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#7A4300">L4/L7 load balancing</text><text x="354.0" y="629.5" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#A27B4C">origin pools · health checks · TCP and HTTP</text>
<rect x="70" y="664" width="568" height="80" rx="14" fill="url(#g3)" stroke="#F5A524" stroke-width="2"/><text x="354.0" y="701.3" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#7A4300">Site fabric</text><text x="354.0" y="721.5" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#A27B4C">CE tunnels into VPCs — backends need NO public IPs · multi-cloud</text>
<rect x="70" y="758" width="568" height="110" rx="14" fill="url(#g4)" stroke="#F5A524" stroke-width="2"/><text x="354.0" y="798.8" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#7A4300">Knows:</text><text x="354.0" y="817.5" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#5B6677">VIPs, sites, IPs, requests, attack patterns</text><text x="354.0" y="837.8" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#8E1B1B">Does NOT know what an “API product” is</text>
<rect x="696" y="330" width="620" height="560" rx="18" fill="url(#g6)" stroke="#9B6CF0" stroke-width="2.5" filter="url(#sh)"/>
<path d="M696,368 V348 a18,18 0 0 1 18,-18 H1298 a18,18 0 0 1 18,18 V368 z" fill="url(#g7)" stroke="#59379E" stroke-width="2.5"/>
<text x="714" y="355.0" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">Apigee · API governance</text>
<rect x="722" y="388" width="568" height="80" rx="14" fill="url(#g3)" stroke="#9B6CF0" stroke-width="2"/><text x="1006.0" y="425.3" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#4B2A9A">API proxies</text><text x="1006.0" y="445.6" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#816AB8">versioned façades in front of backends</text>
<rect x="722" y="480" width="568" height="80" rx="14" fill="url(#g3)" stroke="#9B6CF0" stroke-width="2"/><text x="1006.0" y="517.3" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#4B2A9A">Policy engine</text><text x="1006.0" y="537.5" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#816AB8">OAuth · API key · JWT · quota · spike arrest · CORS</text>
<rect x="722" y="572" width="568" height="80" rx="14" fill="url(#g3)" stroke="#9B6CF0" stroke-width="2"/><text x="1006.0" y="609.3" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#4B2A9A">Mediation</text><text x="1006.0" y="629.5" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#816AB8">transform payloads · SOAP ↔ REST · mashups</text>
<rect x="722" y="664" width="568" height="80" rx="14" fill="url(#g3)" stroke="#9B6CF0" stroke-width="2"/><text x="1006.0" y="701.3" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#4B2A9A">Developer platform</text><text x="1006.0" y="721.5" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#816AB8">portal · products · apps · analytics · monetization</text>
<rect x="722" y="758" width="568" height="110" rx="14" fill="url(#g6)" stroke="#9B6CF0" stroke-width="2"/><text x="1006.0" y="798.8" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#4B2A9A">Knows:</text><text x="1006.0" y="817.5" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#5B6677">developers, apps, products, quotas, payload shapes</text><text x="1006.0" y="837.8" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#8E1B1B">Does NOT build network paths to your backends</text>
<rect x="44" y="914" width="1272" height="70" rx="14" fill="url(#g3)" stroke="#8B95A5" stroke-width="2"/><text x="680.0" y="945.2" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#2F3846">Overlap zone — both terminate TLS, rate-limit, and allow/deny</text><text x="680.0" y="964.0" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#5B6677">a coincidence of edge protocols: choose by the problem (governance vs delivery &amp; security), not by the shared verbs</text>
<text x="44" y="1028.7" text-anchor="start" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#2B2D8F" letter-spacing="1.2">THE COMBINED PATTERN</text>
<rect x="44" y="1052" width="270" height="84" rx="14" fill="url(#g1)" stroke="#4C8DF6" stroke-width="2" filter="url(#sh)"/><text x="179.0" y="1091.3" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#1C3F94">Public API consumer</text><text x="179.0" y="1111.5" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#5974B4">developer / machine</text>
