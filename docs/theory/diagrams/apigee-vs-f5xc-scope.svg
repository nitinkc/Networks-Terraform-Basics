<text x="44" y="59.2" text-anchor="start" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="32" font-weight="700" fill="#1F2A44">Apigee vs F5 Distributed Cloud: who owns which layer</text>
<text x="44" y="90.0" text-anchor="start" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#5B6677">XC delivers and shields traffic; Apigee governs APIs as products. The overlap is edge verbs, not feature parity</text>
