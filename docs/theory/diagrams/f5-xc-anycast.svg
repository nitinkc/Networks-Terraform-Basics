<text x="177.36" y="948.8" text-anchor="start" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#5F4C00">Public IPs shown are documentation examples. Anycast chooses an edge, not a backend; no request is copied to all REs.</text></svg>
